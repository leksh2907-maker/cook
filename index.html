<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#171717">
<title>Cook for the Code · Where culinary art meets programming intelligence</title>
<style>
:root{--bg:#171717;--bg2:#29201E;--bg3:#1f1a18;--wine:#873D36;--wine-h:#9A4840;--cu:#B27A4C;--cu-h:#C98E5E;--iv:#E9E0D2;--tp:#A69A8B;--ln:#403632;--ok:#9DB58B;--bad:#D98479;
--serif:"Playfair Display","Bodoni 72",Didot,"Iowan Old Style","Palatino Linotype",Georgia,serif;--sans:Inter,system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",sans-serif;--mono:"JetBrains Mono",ui-monospace,"SFMono-Regular",Menlo,Consolas,monospace;
--sh:0 22px 44px -26px rgba(0,0,0,.85);--r:8px}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;min-height:100vh;color:var(--iv);font:15.5px/1.6 var(--sans);background:var(--bg);overflow-x:hidden;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0;z-index:-1;background:radial-gradient(900px 480px at 82% -8%,rgba(135,61,54,.17),transparent 65%),radial-gradient(700px 420px at -5% 0,rgba(178,122,76,.07),transparent 60%),var(--bg)}
h1,h2,h3{font-family:var(--serif);margin:0;line-height:1.12;letter-spacing:-.005em;font-weight:700}
h2{font-size:1.45rem}
p{margin:.4em 0}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--cu-h);outline-offset:2px}
.ico{width:1em;height:1em;display:inline-block;vertical-align:-.14em;flex:none}
.muted{color:var(--tp)}
.wrap{max-width:1160px;margin:0 auto;padding:20px 24px 70px;position:relative;z-index:1}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:6px 0 14px;border-bottom:1px solid var(--ln);margin-bottom:8px}
.brand{display:flex;align-items:center;gap:11px;font:700 1.2rem var(--serif);color:var(--iv);text-decoration:none;letter-spacing:.01em}
.brand .ico{font-size:1.7rem;color:var(--cu)}
.card{background:var(--bg2);border:1px solid var(--ln);border-radius:var(--r);padding:22px;box-shadow:var(--sh)}
.err{color:var(--bad);font-weight:600;min-height:1.4em;margin:.6em 0 0;font-size:.92rem}

/* buttons & inputs */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;cursor:pointer;font-weight:600;letter-spacing:.01em;padding:11px 24px;border-radius:6px;color:var(--iv);background:var(--wine);border:1px solid #a1534b;transition:background .2s,border-color .2s,transform .15s}
.btn:hover{background:var(--wine-h)}
.btn:active{transform:translateY(1px)}
.btn[disabled]{opacity:.55;cursor:wait}
.btn.ghost{background:transparent;border-color:var(--ln);color:var(--iv)}
.btn.ghost:hover{border-color:var(--cu);color:var(--cu-h)}
.btn.gold{background:var(--cu);border-color:var(--cu-h);color:#171717}
.btn.gold:hover{background:var(--cu-h)}
.btn.sm{padding:8px 16px;font-size:.88rem}
.field{display:block;margin:16px 0 0;font-size:.84rem;font-weight:500;color:var(--tp)}
.field input,#veil input{display:block;width:100%;margin-top:7px;padding:12px 14px;border-radius:6px;border:1px solid var(--ln);background:var(--bg);color:var(--iv);font-size:1rem;transition:border-color .2s,box-shadow .2s}
.field input::placeholder,#veil input::placeholder{color:#6f655b}
.field input:focus,#veil input:focus{outline:0;border-color:var(--cu);box-shadow:0 0 0 3px rgba(178,122,76,.2)}

/* chef robot */
.robot{display:block;overflow:visible}
.robot .rb{animation:rbob 4.5s ease-in-out infinite}
.robot .head{transform-origin:110px 126px;animation:rtilt 7s ease-in-out infinite}
.robot .eye{fill:#ffb36b;transform-box:fill-box;transform-origin:center;animation:rblink 5.5s infinite}
.robot .eye.e2{animation-delay:.04s}
.robot .led{animation:rled 2.4s ease-in-out infinite}
.robot .arm-r{transform-origin:170px 150px}
.robot .arm-l{transform-origin:50px 150px}
.robot.stir .arm-r{animation:rstir 1.5s ease-in-out infinite}
.robot .steam{fill:none;stroke:#E9E0D2;stroke-width:2.5;stroke-linecap:round;opacity:0;animation:rsteam 3.2s ease-out infinite}
.robot .steam.s2{animation-delay:-1.1s}.robot .steam.s3{animation-delay:-2.1s}
.robot.cheer .rb{animation:rjump .7s ease-in-out infinite}
.robot.cheer .arm-l{animation:rcl .7s ease-in-out infinite}
.robot.cheer .arm-r{animation:rcr .7s ease-in-out infinite}
@keyframes rbob{50%{transform:translateY(-3px)}}
@keyframes rtilt{0%,100%{transform:rotate(-2.5deg)}50%{transform:rotate(2.5deg) translateY(-1px)}}
@keyframes rblink{0%,93%,100%{transform:scaleY(1)}96%{transform:scaleY(.08)}}
@keyframes rled{50%{opacity:.35}}
@keyframes rstir{0%,100%{transform:rotate(-7deg)}50%{transform:rotate(9deg)}}
@keyframes rsteam{0%{transform:translateY(8px);opacity:0}25%{opacity:.5}100%{transform:translateY(-26px);opacity:0}}
@keyframes rjump{50%{transform:translateY(-9px)}}
@keyframes rcl{0%,100%{transform:rotate(138deg)}50%{transform:rotate(158deg)}}
@keyframes rcr{0%,100%{transform:rotate(-138deg)}50%{transform:rotate(-158deg)}}

/* landing */
.hero{display:grid;grid-template-columns:1.1fr .9fr;gap:56px;align-items:center;padding:34px 0 46px;min-height:calc(100vh - 140px)}
.hero h1{font-size:clamp(3.4rem,8.2vw,7rem);font-weight:800;line-height:.92;letter-spacing:-.025em;margin:6px 0 20px}
.tag{font:italic 500 clamp(1.15rem,2.3vw,1.5rem)/1.35 var(--serif);color:var(--cu-h);margin:0 0 14px}
.lead{max-width:500px;color:var(--tp);font-size:1.05rem}
.snip{margin:26px 0 0;padding:18px 22px;border-radius:var(--r);background:#121110;border:1px solid var(--ln);color:var(--iv);font:.86rem/1.75 var(--mono);max-width:100%;overflow:auto;box-shadow:var(--sh)}
.k{color:#c9786f}.f{color:var(--cu-h)}.s{color:#b9c9a3}.c{color:#7b7066}
.snip .cur{display:inline-block;width:8px;height:1em;background:var(--cu);vertical-align:-.15em;animation:blink 1s steps(1) infinite}
@keyframes blink{50%{opacity:0}}
.rightcol{display:flex;flex-direction:column;gap:16px;min-width:0}
.stage{position:relative;overflow:hidden;height:270px;border:1px solid var(--ln);border-radius:var(--r);display:flex;align-items:flex-end;justify-content:center;background:radial-gradient(360px 230px at 68% 38%,rgba(178,122,76,.26),transparent 70%),linear-gradient(#241d1a,#171717)}
.stage::before{content:"";position:absolute;inset:0;background:var(--hero-img,none) center/cover;opacity:.4;mix-blend-mode:luminosity}
.stage::after{content:"";position:absolute;left:0;right:0;bottom:0;height:16px;background:linear-gradient(#3a2f2b,#29201E);border-top:1px solid var(--cu)}
.stage .robot{position:relative;z-index:1;height:96%;width:auto}
.login{padding:28px}
.login h2{font-size:1.6rem}
.login .sub{color:var(--tp);margin:.3em 0 .2em}
.login .btn{width:100%;margin-top:22px;padding:14px}
.sec-t{display:flex;align-items:center;gap:16px;margin:40px 0 16px}
.sec-t::after{content:"";flex:1;height:1px;background:var(--ln)}
.sec-t h2{font-size:1.7rem}
.rounds{display:grid;grid-template-columns:repeat(5,1fr);gap:0;border:1px solid var(--ln);border-radius:var(--r);overflow:hidden;background:var(--bg2)}
.rc{padding:22px 18px;border-left:1px solid var(--ln);transition:background .25s}
.rc:first-child{border-left:0}
.rc:hover{background:#312623}
.rc .ico{font-size:1.7rem;color:var(--cu);margin-bottom:14px}
.rc small{display:block;color:var(--tp);font-size:.82rem}
.rc b{display:block;font:700 1.08rem var(--serif);margin:2px 0 4px}

/* dashboard */
.welcome{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:16px;margin:22px 0 22px}
.welcome h1{font-size:clamp(2rem,4.6vw,3.2rem)}
.welcome h1 span{color:var(--cu-h)}
.welcome p{color:var(--tp);margin:.4em 0 0}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:16px}
.stat{display:flex;align-items:center;gap:14px;padding:16px 18px}
.stat .ico{font-size:1.5rem;color:var(--cu)}
.stat b{display:block;font:700 1.8rem/1 var(--serif)}
.stat small{color:var(--tp);font-size:.84rem}
.stat b em{font:500 .95rem var(--sans);color:var(--tp);font-style:normal}
.stepper{display:flex;align-items:center;padding:20px 26px;margin-bottom:22px}
.stp{display:flex;flex-direction:column;align-items:center;gap:7px;font-size:.78rem;font-weight:500;color:var(--tp);text-align:center;flex:none;width:84px}
.dot{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;background:var(--bg);color:var(--tp);font:600 .85rem var(--mono);border:1px solid var(--ln);transition:.3s}
.stp.done .dot{background:var(--cu);border-color:var(--cu);color:#171717}
.stp.now .dot{border-color:var(--cu-h);color:var(--cu-h);animation:ring 2.4s infinite}
@keyframes ring{70%{box-shadow:0 0 0 9px rgba(178,122,76,0)}0%{box-shadow:0 0 0 0 rgba(178,122,76,.5)}}
.stp.done,.stp.now{color:var(--iv)}
.ln{flex:1;height:2px;background:var(--ln);margin-bottom:24px;overflow:hidden}
.ln i{display:block;height:100%;width:0;background:var(--cu);transition:width .8s}
.ln.on i{width:100%}
.pill{display:inline-flex;align-items:center;gap:7px;padding:4px 11px;border-radius:4px;font-size:.78rem;font-weight:600;background:var(--bg);border:1px solid var(--ln);color:var(--tp)}
.pill::before{content:"";width:7px;height:7px;border-radius:50%;background:currentColor}
.pill.ok{color:var(--ok)}.pill.warn{color:var(--bad)}.pill.gold{color:var(--cu-h)}
.pill .ico{display:none}
.dash{display:grid;grid-template-columns:minmax(0,1fr) 330px;gap:22px;align-items:start}
.levels{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
.lc{position:relative;display:flex;flex-direction:column;padding:22px;border-radius:var(--r);background:var(--bg2);border:1px solid var(--ln);box-shadow:var(--sh);transition:border-color .3s,transform .3s}
.lc:hover{border-color:var(--cu);transform:translateY(-2px)}
.lc .num{display:flex;align-items:center;gap:10px;font:500 .82rem var(--mono);color:var(--cu-h)}
.lc .big{font-size:1.9rem;color:var(--cu);margin:14px 0 10px}
.lc h3{font-size:1.35rem}
.lc .d{color:var(--tp);margin:.45em 0 14px;min-height:4.4em;font-size:.93rem}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:16px}
.chip{display:inline-flex;align-items:center;gap:5px;font-size:.76rem;padding:3px 9px;border-radius:4px;border:1px solid var(--ln);color:var(--tp)}
.lc .foot{margin-top:auto;display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;padding-top:14px;border-top:1px solid var(--ln)}
.lc .st{font-size:.85rem;color:var(--tp)}
.lc.locked{opacity:.55}.lc.locked:hover{transform:none;border-color:var(--ln)}
.lc.locked .big{color:var(--tp)}
.lc.done{border-color:rgba(178,122,76,.55)}
.lc.done::before{content:"";position:absolute;left:0;right:0;top:0;height:2px;background:var(--cu)}
.score{font:700 1.5rem var(--serif);color:var(--cu-h)}.score small{font:500 .85rem var(--sans);color:var(--tp)}
.lock-i{position:absolute;right:20px;top:20px;font-size:1.1rem;color:var(--tp)}
.earn{font-size:.8rem;color:var(--tp);margin:-4px 0 12px}
.earn b{color:var(--iv);font-weight:600}
.champ{display:flex;align-items:center;gap:22px;flex-wrap:wrap;margin-bottom:18px;border-color:var(--cu);background:linear-gradient(120deg,#2d2321,#3a1f1c)}
.champ .robot{height:110px;width:auto}
.champ h2{color:var(--cu-h);font-size:1.8rem}

/* side: mascot + recipe collection */
.side{position:sticky;top:16px;display:flex;flex-direction:column;gap:16px}
.side .stage{height:200px}
.recipe h2{font-size:1.25rem}
.recipe .sub{color:var(--tp);font-size:.86rem;margin:.3em 0 14px}
.ings{list-style:none;margin:0 0 16px;padding:0;display:grid;gap:8px}
.ings li{display:flex;align-items:center;gap:12px;padding:9px 11px;border:1px solid var(--ln);border-radius:6px;background:var(--bg);opacity:.55}
.ings li.got{opacity:1;border-color:rgba(178,122,76,.5)}
.ings .ii{width:34px;height:34px;display:grid;place-items:center;border-radius:6px;border:1px solid var(--ln);font-size:1.15rem;color:var(--tp)}
.ings li.got .ii{color:var(--cu-h);border-color:var(--cu)}
.ings b{display:block;font-size:.9rem;font-weight:600}.ings small{color:var(--tp);font-size:.78rem}
.codebox{border:1px solid var(--ln);border-radius:6px;background:#121110;overflow:hidden}
.codebox .cb-h{display:flex;justify-content:space-between;padding:7px 12px;background:var(--bg3);border-bottom:1px solid var(--ln);font:.74rem var(--mono);color:var(--tp)}
.codebox pre{margin:0;padding:12px;font:.8rem/1.8 var(--mono);overflow:auto;color:var(--iv)}
.codebox .sl{color:#5a5048}

/* leaderboard */
.board{padding:6px 6px 12px;overflow:hidden}
.board .scroll{overflow-x:auto}
table{width:100%;border-collapse:collapse}
.board th{font-size:.8rem;font-weight:500;color:var(--tp);text-align:left;padding:14px 14px 10px;border-bottom:1px solid var(--ln)}
.board td{padding:12px 14px;border-top:1px solid var(--ln);white-space:nowrap;font-variant-numeric:tabular-nums}
.board tbody tr:first-child td{border-top:0}
.board tr.me td{background:rgba(178,122,76,.1);font-weight:600}
.board tr.me td:first-child{box-shadow:inset 3px 0 0 var(--cu)}
.board tbody tr{transition:background .2s}.board tbody tr:hover td{background:rgba(233,224,210,.04)}
.rk{display:inline-grid;place-items:center;min-width:28px;height:28px;border-radius:4px;border:1px solid var(--ln);font:600 .82rem var(--mono)}
.rk.r1{background:var(--cu);border-color:var(--cu);color:#171717}.rk.r2{border-color:var(--cu);color:var(--cu-h)}.rk.r3{border-color:#7a5a43;color:#c9a07c}

/* play screens */
.playbar{position:sticky;top:10px;z-index:20;display:flex;align-items:center;gap:16px;padding:12px 18px;border-radius:var(--r);margin-bottom:18px;background:rgba(31,26,24,.96);border:1px solid var(--ln);box-shadow:var(--sh);backdrop-filter:blur(10px)}
.playbar .ico.l{font-size:1.7rem;color:var(--cu)}
.playbar .tt{min-width:0;flex:1}
.playbar .tt small{display:block;color:var(--tp);font-size:.78rem}
.playbar .tt b{font:700 1.15rem var(--serif);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:block}
.pg{height:3px;background:var(--ln);margin-top:7px;overflow:hidden}.pg i{display:block;height:100%;width:0;background:var(--cu);transition:width .35s}
.timer{display:flex;align-items:center;gap:9px;padding:8px 14px;border-radius:6px;border:1px solid var(--ln);background:var(--bg);color:var(--cu-h);flex:none}
#timer{font:600 1.35rem var(--mono);font-variant-numeric:tabular-nums}
.timer.low{background:var(--wine);border-color:#a1534b;color:var(--iv);animation:pulse 1s infinite}
@keyframes pulse{50%{opacity:.75}}
.q{margin-bottom:14px;animation:rise .45s both}
@keyframes rise{from{opacity:0;transform:translateY(10px)}}
.q .qh{display:flex;gap:14px;align-items:flex-start;font:600 1.12rem/1.45 var(--serif);margin-bottom:14px}
.qn{flex:none;min-width:34px;height:34px;border-radius:6px;display:grid;place-items:center;border:1px solid var(--cu);color:var(--cu-h);font:600 .85rem var(--mono)}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.opt{display:flex;align-items:center;gap:12px;width:100%;text-align:left;padding:12px 14px;border-radius:6px;background:var(--bg);border:1px solid var(--ln);cursor:pointer;transition:border-color .2s,background .2s}
.opt i{flex:none;width:26px;height:26px;border-radius:4px;display:grid;place-items:center;border:1px solid var(--ln);font:600 .78rem var(--mono);font-style:normal;color:var(--tp);transition:.2s}
.opt:hover{border-color:var(--cu)}
.opt.sel{background:rgba(178,122,76,.12);border-color:var(--cu)}
.opt.sel i{background:var(--cu);border-color:var(--cu);color:#171717}
.submit-row{display:flex;justify-content:center;padding:20px 0 4px}
.submit-row .btn{padding:15px 44px;font-size:1rem}
.pr{margin-bottom:16px;animation:rise .45s both}
.pr .ph{display:flex;align-items:center;gap:12px;flex-wrap:wrap;font:600 1.1rem/1.4 var(--serif);margin-bottom:14px}
.lang{font:500 .72rem var(--mono);padding:3px 9px;border-radius:4px;border:1px solid var(--cu);color:var(--cu-h)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.two small{display:block;font-size:.82rem;color:var(--tp);margin-bottom:7px}
.bank{min-height:112px;padding:10px;border:1px dashed var(--ln);border-radius:6px;background:rgba(0,0,0,.18);transition:border-color .2s}
.bank:empty::before{content:"Empty";color:#6f655b;font-size:.85rem;display:block;text-align:center;padding:28px 0}
.mine{border-color:var(--cu);counter-reset:p}
.mine:empty::before{content:"Click or drag pieces here"}
.piece{display:flex;align-items:center;gap:10px;background:var(--bg);border:1px solid var(--ln);color:var(--iv);border-radius:5px;padding:9px 12px;margin:6px 0;font:13px/1.4 var(--mono);white-space:pre;overflow-x:auto;cursor:grab;transition:border-color .2s,transform .15s;user-select:none}
.piece:hover{border-color:var(--cu);transform:translateX(2px)}
.piece:active{cursor:grabbing}
.piece::before{content:"⋮⋮";color:#6f655b;letter-spacing:-2px;flex:none}
.mine .piece{counter-increment:p;border-left:3px solid var(--cu)}
.mine .piece::before{content:counter(p);display:grid;place-items:center;width:22px;height:22px;border-radius:4px;background:var(--cu);color:#171717;font:600 .72rem var(--mono);letter-spacing:0}

/* IDE */
.ide-grid{display:grid;grid-template-columns:minmax(260px,.8fr) 1.6fr;gap:18px;align-items:start}
.prob{position:sticky;top:96px}
.prob h2{font-size:1.45rem;margin:6px 0 10px}
.prob .lbl{font-size:.82rem;color:var(--cu-h)}
.prob .stmt{white-space:pre-wrap;color:var(--iv)}
.sample{margin-top:16px;border-radius:6px;overflow:hidden;border:1px solid var(--ln)}
.sample div{padding:10px 14px;font:13px var(--mono);background:#121110}
.sample div+div{border-top:1px solid var(--ln)}
.sample small{display:block;font:500 .74rem var(--sans);color:var(--tp);margin-bottom:2px}
.ide{border-radius:var(--r);overflow:hidden;background:#121110;border:1px solid var(--ln);box-shadow:var(--sh)}
.ide-bar{display:flex;align-items:center;gap:12px;padding:8px 14px;background:var(--bg3);border-bottom:1px solid var(--ln)}
.dots{display:flex;gap:6px}.dots i{width:10px;height:10px;border-radius:50%;background:var(--ln)}.dots i:first-child{background:var(--wine)}.dots i:nth-child(2){background:var(--cu)}
.fname{font:500 .82rem var(--mono);color:var(--iv);padding:5px 12px;border-bottom:2px solid var(--cu)}
.ide select{margin-left:auto;background:var(--bg);color:var(--iv);border:1px solid var(--ln);border-radius:5px;padding:5px 10px;font:500 .84rem var(--sans);cursor:pointer;width:auto}
.ide-edit{display:flex;height:340px;background:#121110}
#gut{margin:0;padding:14px 10px 14px 14px;min-width:46px;text-align:right;color:#5a5048;font:14px/21px var(--mono);overflow:hidden;background:#0e0d0c;user-select:none;border-right:1px solid var(--ln)}
#code{flex:1;min-width:0;resize:none;border:0;outline:0;background:transparent;color:var(--iv);caret-color:var(--cu-h);padding:14px;font:14px/21px var(--mono);white-space:pre;overflow:auto;tab-size:4}
.ide-io{display:grid;grid-template-columns:1fr 1fr;border-top:1px solid var(--ln)}
.ide-io>div{min-width:0}.ide-io>div+div{border-left:1px solid var(--ln)}
.io-h{display:flex;align-items:center;justify-content:space-between;padding:7px 14px;font:500 .78rem var(--sans);color:var(--tp);background:var(--bg3);border-bottom:1px solid var(--ln)}
#stdin,.out{display:block;width:100%;height:150px;margin:0;border:0;outline:0;resize:none;background:#0e0d0c;color:var(--iv);padding:12px 14px;font:13.5px/1.55 var(--mono);overflow:auto;border-radius:0}
.out{white-space:pre-wrap;word-break:break-word}
.out.bad{color:var(--bad)}.out.good{color:var(--ok)}
.io-h .st{font:500 .72rem var(--mono);padding:2px 8px;border-radius:4px;border:1px solid var(--ln)}
.io-h .st.ok{color:var(--ok);border-color:#566650}.io-h .st.bad{color:var(--bad);border-color:#6b3a35}.io-h .st.run{color:var(--cu-h);border-color:var(--cu)}

  max=ids.reduce((a,n)=>a+((state.levels[n]||{}).max||0),0),firstOpen=ids.find(n=>sc[n]===undefined&&n<=state.unlocked);
 const cards=ids.map(n=>{const isDone=sc[n]!==undefined,open=n<=state.unlocked,m=META[n],L=state.levels[n]||{},can=!isDone&&open&&state.event_active&&!state.paused;
  const status=isDone?'':!open?'Locked. Finish the previous stage first.':!state.event_active?'Waiting for the organisers to start the event.':state.paused?'<span class="err">Team paused by an organiser.</span>':'Fullscreen is required to play.';
  return `<div class="lc ${isDone?'done':!open?'locked':''}">${!open?`<span class="lock-i">${ico('i-lock')}</span>`:''}
   <span class="num">Stage ${n}</span>${ico(m.ic,'big')}<h3>${NAMES[n]}</h3><p class="d">${m.d}</p>
   <div class="chips"><span class="chip">${m.t}</span>${L.seconds?`<span class="chip">${ico('i-clock')} ${Math.round(L.seconds/60)} min</span>`:''}${L.max?`<span class="chip">${L.max} pts</span>`:''}</div>
   ${isDone?`<p class="earn">Collected: <b>${REW[n].ing}</b> and fragment ${n}</p>`:''}
   <div class="foot">${isDone?`<span class="score">${sc[n]}${L.max?` <small>/ ${L.max}</small>`:''}</span><span class="pill ok">Submitted</span>`
   :`<span class="st">${status}</span>${can?`<button class="btn sm" onclick="begin(${n})">${ico('i-play')} ${L.started?'Resume':'Start'} stage ${n}</button>`:''}`}</div></div>`}).join('');
 const steps=ids.map((n,i)=>`${i?`<div class="ln ${sc[ids[i-1]]!==undefined?'on':''}"><i></i></div>`:''}<div class="stp ${sc[n]!==undefined?'done':n===firstOpen?'now':''}"><span class="dot">${sc[n]!==undefined?ico('i-check'):n}</span>${NAMES[n].split(' ')[0]}</div>`).join('');
 const champ=done===ids.length?`<div class="card champ">${robot('cheer')}<div><h2>Master Chef status unlocked</h2><p>All five stages are served. Final score: <b>${total}${max?' / '+max:''}</b>. Watch the leaderboard for the final ranking.</p></div></div>`:'';
 const ings=ids.map(n=>{const g=sc[n]!==undefined;return `<li class="${g?'got':''}"><span class="ii">${ico(g?REW[n].ic:'i-lock')}</span><span><b>${g?REW[n].ing:'Sealed'}</b><small>${g?REW[n].note:'Complete stage '+n+' to unlock'}</small></span></li>`}).join('');
 const code=ids.map(n=>sc[n]!==undefined?REW[n].frag:`<span class="sl">    # fragment ${n} sealed</span>`).join('\n');
 app.innerHTML=`<div class="top">${brand}<button class="btn ghost sm" onclick="logout()">Sign out</button></div>
 <div class="welcome"><div><h1>Welcome, <span>${esc(state.name)}</span></h1><p>${state.event_active?'The kitchen is open. Choose your next stage.':'The kitchen opens soon. Stand by, chef.'}</p></div>
  <span class="pill ${state.paused?'warn':state.event_active?'ok':'gold'}">${state.paused?'Paused':state.event_active?'Event live':'Waiting to start'}</span></div>
 ${champ}
 <div class="stats"><div class="card stat">${ico('i-star')}<div><b>${total}${max?` <em>/ ${max}</em>`:''}</b><small>Total score</small></div></div>
  <div class="card stat">${ico('i-trophy')}<div><b id="myRank">–</b><small>Leaderboard rank</small></div></div>
  <div class="card stat">${ico('i-layers')}<div><b>${done} <em>/ ${ids.length}</em></b><small>Stages completed</small></div></div>
  <div class="card stat">${ico('i-code')}<div><b>${done} <em>/ ${ids.length}</em></b><small>Code fragments</small></div></div></div>
 <div class="card stepper">${steps}</div>
 <div class="dash"><div class="levels">${cards}</div>
  <aside class="side"><div class="stage">${robot('stir',true)}</div>
   <div class="card recipe"><h2>Recipe collection</h2><p class="sub">Every stage you finish unlocks an ingredient and one line of the final recipe.</p>
    <ul class="ings">${ings}</ul>
    <div class="codebox"><div class="cb-h"><span>recipe.py</span><span>${done}/${ids.length} fragments</span></div><pre>${code}</pre></div></div></aside></div>
 ${boardHtml()}`;loadBoard()}

async function begin(n){lv=n;try{await document.documentElement.requestFullscreen()}catch(e){alert('Fullscreen is required to start. Please allow fullscreen and try again.');return}
 showLoad(`Preparing ${NAMES[n]}…`);
 try{const r=await api(`/level/${n}/start`,{method:'POST'});playing=true;ans={};document.body.classList.add('playing');window.scrollTo(0,0);
  if(r.questions){qs=r.questions;quiz(r.remaining)}else if(r.problem)codeView(r);else orderView(r)}catch(e){alert(e.message)}
 hideLoad()}
function startTimer(rem){timerEnd=Date.now()+rem*1000;timerPaused=false;clearInterval(tick);clearInterval(syncTick);
 const paint=()=>{const t=$('#timer');if(!t)return;const s=Math.max(0,Math.round((timerEnd-Date.now())/1000));
  t.textContent=timerPaused?'PAUSED BY ORGANISER':`${Math.floor(s/60)}:${String(s%60).padStart(2,'0')}`;t.parentElement.classList.toggle('low',!timerPaused&&s<60);
  if(!timerPaused&&s===0){clearInterval(tick);clearInterval(syncTick);$('#timer').textContent='TIME UP';alert('Time is up. Your answers will be submitted.');sendAnswers()}};
 tick=setInterval(paint,250);syncTick=setInterval(async()=>{try{const m=await api('/me');const info=m.levels[String(lv)];timerPaused=m.paused;timerEnd=Date.now()+info.remaining*1000;paint()}catch(e){}},3000);paint()}
const playbar=(sub,prog)=>`<div class="playbar">${ico(META[lv].ic,'l')}<div class="tt"><small>Stage ${lv} · ${sub}</small><b>${NAMES[lv]}</b>${prog?'<div class="pg"><i id="pf"></i></div>':''}</div><div class="timer">${ico('i-clock')}<span id="timer"></span></div></div>`;

/* ---------- levels 1 & 2: question challenges ---------- */
function quiz(rem){app.innerHTML=playbar('<span id="prog">0 answered</span>',1)+qs.map((q,k)=>`<div class="card q" style="animation-delay:${Math.min(k,8)*.05}s"><div class="qh"><span class="qn">${q.idx+1}</span><span>${esc(q.q)}</span></div><div class="opts">`+
  q.options.map((o,i)=>`<button class="opt" data-q="${q.idx}" data-o="${i}" onclick="pick(this)"><i>${String.fromCharCode(65+i)}</i><span>${esc(o)}</span></button>`).join('')+`</div></div>`).join('')+
  `<div class="submit-row"><button class="btn" onclick="sendAnswers()">Submit answers</button></div>`;startTimer(rem)}
function pick(b){ans[b.dataset.q]=+b.dataset.o;document.querySelectorAll(`[data-q="${b.dataset.q}"]`).forEach(x=>x.classList.remove('sel'));b.classList.add('sel');
 const n=Object.keys(ans).length;$('#prog').textContent=`${n} of ${qs.length} answered`;$('#pf').style.width=(n/qs.length*100)+'%'}

/* ---------- levels 3 & 5: ordering challenges (bank on the left, your sequence on the right) ---------- */
function orderView(r){const parts=r.challenges||r.parts;sel={};parts.forEach(p=>sel[p.id]=[]);window._parts=parts;
 app.innerHTML=playbar(META[lv].t)+parts.map((p,k)=>`<div class="card pr" style="animation-delay:${Math.min(k,8)*.06}s"><div class="ph"><span>${esc(p.prompt)}</span> ${p.lang?`<span class="lang">${esc(p.lang)}</span>`:''}</div>
  <div class="two"><div><small>Pieces (click or drag)</small><div class="bank" id="bank-${p.id}" ondragover="event.preventDefault()" ondrop="drop(event,'${p.id}',-1,true)"></div></div>
  <div><small>Your order</small><div class="bank mine" id="mine-${p.id}" ondragover="event.preventDefault()" ondrop="drop(event,'${p.id}',null)"></div></div></div></div>`).join('')+
  `<div class="submit-row"><button class="btn" onclick="sendAnswers()">Submit</button></div>`;parts.forEach(draw);startTimer(r.remaining)}
function draw(p){const used=sel[p.id];
 $('#bank-'+p.id).innerHTML=p.items.filter(x=>!used.includes(x)).map(x=>`<div class="piece" draggable="true" ondragstart="event.dataTransfer.setData('t',JSON.stringify({p:'${p.id}',x:${JSON.stringify(x).replace(/"/g,'&quot;')}}))" onclick="mv('${p.id}',this.textContent,1)"></div>`).join('');
 $('#bank-'+p.id).querySelectorAll('.piece').forEach((e,i)=>e.textContent=p.items.filter(x=>!used.includes(x))[i]);
 $('#mine-'+p.id).innerHTML='';used.forEach((x,i)=>{const e=document.createElement('div');e.className='piece';e.draggable=true;e.textContent=x;
  e.ondragstart=ev=>ev.dataTransfer.setData('t',JSON.stringify({p:p.id,x}));e.ondragover=ev=>ev.preventDefault();e.ondrop=ev=>{ev.stopPropagation();drop(ev,p.id,i)};
  e.onclick=()=>mv(p.id,x,0);$('#mine-'+p.id).appendChild(e)})}
function mv(id,x,add){const l=sel[id];if(add)l.push(x);else l.splice(l.indexOf(x),1);draw(window._parts.find(p=>p.id===id))}
function drop(ev,id,pos,toBank){ev.preventDefault();const d=JSON.parse(ev.dataTransfer.getData('t'));if(d.p!==id)return;const l=sel[id];
 const i=l.indexOf(d.x);if(i>-1)l.splice(i,1);if(!toBank)l.splice(pos===null?l.length:pos,0,d.x);draw(window._parts.find(p=>p.id===id))}

/* ---------- level 4: mini IDE (real compiler via /level/4/run) ---------- */
function codeView(r){const pr=r.problem;app.innerHTML=playbar('Programming')+`<div class="ide-grid">
 <div class="card prob"><span class="lbl">Today's order</span><h2>${esc(pr.title)}</h2><p class="stmt">${esc(pr.statement)}</p>
  <div class="sample"><div><small>Sample input</small>${esc(pr.sample.in)}</div><div><small>Expected output</small>${esc(pr.sample.out)}</div></div></div>
 <div class="ide"><div class="ide-bar"><span class="dots"><i></i><i></i><i></i></span><span class="fname" id="fname">main.py</span>
   <select id="lang" onchange="tpl()"><option value="python">Python</option><option value="c">C</option></select></div>
  <div class="ide-edit"><pre id="gut" aria-hidden="true">1</pre><textarea id="code" spellcheck="false" wrap="off" autocapitalize="off" autocomplete="off"></textarea></div>
  <div class="ide-io"><div><div class="io-h">Input (stdin)</div><textarea id="stdin" spellcheck="false">${esc(pr.sample.in)}</textarea></div>
   <div><div class="io-h">Output <span id="stat"></span></div><pre id="out" class="out"></pre></div></div>
  <div class="ide-act"><button class="btn ghost sm" id="runb" onclick="runCode()">${ico('i-play')} Run code</button><button class="btn gold sm" onclick="submitCode()">Submit for scoring</button><span class="hint">Ctrl + Enter to run</span></div></div></div>`;
 tpl();startTimer(r.remaining);const c=$('#code');
 c.addEventListener('keydown',e=>{if(e.key==='Tab'){e.preventDefault();const t=e.target,s=t.selectionStart;t.value=t.value.slice(0,s)+'    '+t.value.slice(t.selectionEnd);t.selectionStart=t.selectionEnd=s+4;gut()}
  else if(e.key==='Enter'&&(e.ctrlKey||e.metaKey)){e.preventDefault();runCode()}});
 c.addEventListener('input',gut);c.addEventListener('scroll',()=>$('#gut').scrollTop=c.scrollTop)}
function gut(){const n=$('#code').value.split('\n').length;$('#gut').textContent=Array.from({length:n},(_,i)=>i+1).join('\n');$('#gut').scrollTop=$('#code').scrollTop}
function tpl(){$('#code').value=$('#lang').value==='c'?'#include <stdio.h>\n\nint main() {\n    \n    return 0;\n}\n':'a, b = map(int, input().split())\n';$('#fname').textContent=$('#lang').value==='c'?'main.c':'main.py';gut()}
async function runCode(){const o=$('#out'),s=$('#stat'),b=$('#runb');o.className='out';s.className='st run';s.innerHTML='<span class="spin"></span> Cooking';o.textContent='Running...';b.disabled=true;
 try{const r=await api('/level/4/run',{method:'POST',body:{lang:$('#lang').value,code:$('#code').value,stdin:$('#stdin').value}});
  o.textContent=(r.ok?'':`[${r.stage} error]\n`)+r.stdout+r.stderr;o.className='out '+(r.ok?'good':'bad');s.className='st '+(r.ok?'ok':'bad');s.textContent=r.ok?'DONE':'ERROR'}
 catch(e){o.textContent=e.message;o.className='out bad';s.className='st bad';s.textContent='ERROR'}b.disabled=false}
function submitCode(){if(confirm('Submit now? You can only submit once.'))sendAnswers()}

/* ---------- submit + celebration ---------- */
async function sendAnswers(){clearInterval(tick);clearInterval(syncTick);let body=ans;
 if(lv===3||lv===5)body=sel;if(lv===4)body={lang:$('#lang').value,code:$('#code').value};
 let res=null;showLoad('Plating your answers…');
 try{res=await api(`/level/${lv}/submit`,{method:'POST',body:{answers:body}})}catch(e){hideLoad();alert(e.message)}
 hideLoad();playing=false;$('#veil').style.display='none';if(document.fullscreenElement)document.exitFullscreen();
 res?celebrate(res,lv):home()}
function celebrate(res,n){document.body.classList.remove('playing');window.scrollTo(0,0);
 const ratio=res.max_score?res.score/res.max_score:1,msg=ratio>=.8?'An exceptional service.':ratio>=.5?'Well seasoned.':'Served. Keep refining.',R=REW[n],master=n===5;
 const dots=`<div class="prog5">${[1,2,3,4,5].map(i=>`<i class="${i<=n?'on':''}"></i>`).join('')}</div>`;
 const d=$('#done');
 if(!master){d.innerHTML=`<div class="card fin">${robot('cheer')}<h2>${NAMES[n]} complete</h2><p class="muted">${msg}</p>
  <div class="sc"><span id="cnt">0</span><small> / ${res.max_score}</small></div>
  <div class="rw"><div><small>Ingredient unlocked</small><div class="ing"><span class="ii">${ico(R.ic)}</span><b>${R.ing}</b></div></div>
   <div><small>Code fragment ${n} of 5</small><code class="typed">${R.frag}</code></div></div>${dots}
  <p class="muted" style="margin-top:16px">Stage ${n+1} (${NAMES[n+1]}) is now unlocked.</p>
  <button class="btn" onclick="home()">Back to the kitchen</button></div>`}
 else{const ids=[1,2,3,4,5];d.innerHTML=`<div class="beam"></div><div class="card fin master">${robot('cheer')}<h2>Master Chef</h2><p class="muted">Every stage is served. ${msg}</p>
  <div class="sc"><span id="cnt">0</span><small> / ${res.max_score}</small></div>
  <div class="mrow">${ids.map(i=>`<span style="--i:${i-1}">${ico(REW[i].ic)} ${REW[i].ing}</span>`).join('')}</div>
  <div class="mcode">${ids.map(i=>`<div style="--i:${i-1}">${REW[i].frag}</div>`).join('')}</div>
  <p class="muted" style="margin-top:16px">Check the leaderboard for your final rank.</p>
  <button class="btn" onclick="home()">Back to the kitchen</button></div>`}
 d.style.display='grid';
 const t0=performance.now(),tot=res.score,step=t=>{const k=Math.min(1,(t-t0)/1100);$('#cnt')&&($('#cnt').textContent=Math.round(tot*(1-Math.pow(1-k,3))));k<1&&requestAnimationFrame(step)};requestAnimationFrame(step)}

/* ---------- exit protection: log + block until admin password entered ---------- */
function guard(kind){if(!playing)return;api('/security/event',{method:'POST',body:{kind}}).catch(()=>{});$('#veil').style.display='grid'}
document.addEventListener('fullscreenchange',()=>{if(!document.fullscreenElement)guard('fullscreen_exit')});
document.addEventListener('visibilitychange',()=>{if(document.hidden)guard('tab_switch')});
window.addEventListener('beforeunload',e=>{if(playing){e.preventDefault();e.returnValue=''}});
history.pushState(null,'',location.href);window.addEventListener('popstate',()=>{if(playing){history.pushState(null,'',location.href);guard('back_navigation')}});
async function verify(){try{await api('/security/verify',{method:'POST',body:{password:$('#vp').value}});$('#vp').value='';$('#verr').textContent='';
 $('#veil').style.display='none';document.documentElement.requestFullscreen().catch(()=>{})}catch(e){$('#verr').textContent=e.message}}

/* ---------- leaderboard ---------- */
function boardHtml(){return `<div class="sec-t"><h2>Leaderboard</h2></div><div class="card board"><div class="scroll"><table><thead><tr><th>Rank</th><th>Team</th><th>ID</th><th>Levels</th><th>Score</th><th>Status</th></tr></thead><tbody id="board"><tr><td colspan="6" class="muted">Loading...</td></tr></tbody></table></div></div>`}
async function loadBoard(){const el=$('#board');if(!el)return;try{const r=await api('/leaderboard');const me=state&&r.find(x=>x.team_id===state.team_id);
 el.innerHTML=r.slice(0,10).map(x=>`<tr class="${me&&x.team_id===me.team_id?'me':''}"><td><span class="rk ${x.rank<4?'r'+x.rank:''}">${x.rank}</span></td><td>${esc(x.name)}</td><td class="muted">${esc(x.team_id)}</td><td>${x.completed}/5</td><td><b>${x.score}</b></td><td><span class="pill ${x.status==='playing'?'ok':x.status==='paused'?'warn':''}">${esc(x.status)}</span></td></tr>`).join('')||'<tr><td colspan="6" class="muted">No teams yet.</td></tr>';
 const mr=$('#myRank');if(mr)mr.textContent=me?'#'+me.rank:'–'}catch(e){}}
setInterval(loadBoard,5000);T?home():loginView();
</script></body></html>
